
workflows:
  radhika-cab:
    name: Radhika Cab APK
    max_build_duration: 120
    instance_type: linux_x2

    scripts:
      - name: Extract Android Project
        script: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d project
          cd project/RadhikaCabGPS

      - name: Install Gradle and Build APK
        script: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          cd project/RadhikaCabGPS
          ./../gradle-8.7/bin/gradle assembleDebug

    artifacts:
      - project/RadhikaCabGPS/app/build/outputs/apk/debug/*.apk
